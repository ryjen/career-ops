name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify locked toolchain
        run: nix flake check --no-build --no-update-lock-file

      - name: Install locked package dependencies
        run: nix develop --no-update-lock-file --command npm ci --ignore-scripts

      - name: Verify public package
        run: nix develop --no-update-lock-file --command npm run verify

  release-candidate:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install locked package dependencies
        run: nix develop --no-update-lock-file --command npm ci --ignore-scripts

      - name: Build and verify unpublished release candidate
        run: nix develop --no-update-lock-file --command npm run release:candidate

      - name: Show bounded candidate summary
        run: nix develop --no-update-lock-file --command cat .release-candidate/candidate.json

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Review dependencies using GitHub dependency graph
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Review dependency manifests without dependency graph
        if: steps.dependency-review.outcome == 'failure'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: nix develop --no-update-lock-file --command node scripts/dependency-diff.mjs --base "origin/${BASE_REF}"
